[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promiseledger"
version = "0.1.0"
description = "Deterministic cross-app commitment reconciler"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PromiseLedger Hackathon Team" }]
dependencies = []

[project.scripts]
promiseledger = "promiseledger.cli:main"
promiseledger-demo = "promiseledger.demo:main"

[tool.setuptools.packages.find]
include = ["promiseledger*"]
