<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PromiseLedger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #111318;
      --panel: #1a1d24;
      --ink: #eef0f4;
      --muted: #9aa3b2;
      --line: #2a303c;
      --accent: #6d7cff;
      --pass: #3ecf8e;
      --fail: #ff6b6b;
      --warn: #f0c14b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "IBM Plex Sans", sans-serif; }
    header {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      padding: 16px 22px; border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.02em; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .run {
      background: var(--accent); color: #fff; border: 0; height: 40px; padding: 0 18px;
      border-radius: 8px; font: 600 14px "IBM Plex Sans", sans-serif; cursor: pointer;
    }
    .run:disabled { opacity: 0.5; cursor: wait; }
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 22px; border-bottom: 1px solid var(--line); }
    .tabs button {
      background: transparent; color: var(--muted); border: 1px solid var(--line);
      border-radius: 8px; padding: 7px 11px; white-space: nowrap; cursor: pointer; font: 500 12px "IBM Plex Sans", sans-serif;
    }
    .tabs button.active { color: var(--ink); border-color: var(--accent); background: #22263a; }
    .hint { padding: 10px 22px 0; color: var(--muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: 1fr 320px 1fr; gap: 12px; padding: 16px 22px 24px; }
    .col { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-height: 460px; overflow: hidden; }
    .col h3 {
      margin: 0; padding: 12px 14px; font-size: 11px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line);
    }
    .app { padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .app:last-child { border-bottom: 0; }
    .app-name { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: #2b3140; }
    .badge.Done { background: #163528; color: var(--pass); }
    .badge.Reopened, .badge.Breached { background: #3a2e12; color: var(--warn); }
    .badge.DRAFT { background: #262b4a; color: #b4bcff; }
    .meta { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .mail { margin-top: 8px; padding: 10px; border-radius: 8px; background: #12151b; font: 12px/1.4 "IBM Plex Mono", monospace; white-space: pre-wrap; }
    .empty { color: var(--muted); padding: 14px; }
    .log { list-style: none; margin: 0; padding: 8px 0; font: 12px/1.5 "IBM Plex Mono", monospace; }
    .log li { padding: 8px 14px; border-bottom: 1px solid #232833; color: var(--muted); }
    .log li.show { color: var(--ink); }
    .log .refuse, .log .fault { color: var(--fail); }
    .log .write, .log .grade { color: var(--pass); }
    .verdict { margin: 0 22px 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-weight: 600; }
    .verdict.pass { color: var(--pass); }
    .verdict.fail { color: var(--fail); }
    .grade { margin: 0 22px 40px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
    th { color: var(--muted); font-weight: 500; }
    .ok { color: var(--pass); } .no { color: var(--fail); }
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>PromiseLedger</h1>
      <p>Pick a case, then run the agent. It reads four apps, writes only if the join is unique, and a separate grader scores final state.</p>
    </div>
    <button class="run" id="run">Run agent</button>
  </header>
  <div class="tabs" id="tabs"></div>
  <p class="hint" id="blurb"></p>
  <section class="grid">
    <div class="col"><h3>Before — seeded world</h3><div id="before"></div></div>
    <div class="col"><h3>Agent log</h3><ul class="log" id="log"><li class="empty">Press Run agent. Nothing has executed yet.</li></ul></div>
    <div class="col"><h3>After — re-read state</h3><div id="after"><div class="empty">Waiting for a run.</div></div></div>
  </section>
  <div class="verdict" id="verdict">Idle</div>
  <div class="grade" id="grade"></div>
  <script>
    const FEATURED = ["s2-desync", "s6-ambiguous-contact", "s10-silent-200"];
    const state = { scenarios: [], current: "s2-desync" };
    const el = (id) => document.getElementById(id);

    function worldView(world) {
      if (!world) return `<div class="empty">No snapshot</div>`;
      const tickets = world.linear.tickets || [];
      const prs = world.github.pull_requests || [];
      const sent = (world.gmail.messages || []).filter((m) => (m.labels || []).includes("SENT"));
      const drafts = world.gmail.drafts || [];
      const slack = world.slack.messages || [];
      const ticketsHtml = tickets.length ? tickets.map((t) =>
        `<div class="row"><span><b>${t.key}</b> · ${t.title}</span><span class="badge ${t.status}">${t.status}</span></div>
         <div class="meta">proof ${t.required_proof || "none"} · ${t.customer_id || "no customer id"}</div>`
      ).join("") : `<div class="empty">No tickets</div>`;
      const prHtml = prs.length ? prs.map((p) =>
        `<div class="row"><span>PR ${p.number || p.id}</span><span class="badge">${p.merged ? "merged" : "open"}</span></div>
         <div class="meta">${(p.linked_ticket_keys || []).join(", ") || "unlinked"}</div>`
      ).join("") : `<div class="empty">No pull requests</div>`;
      const mailHtml = (sent.length || drafts.length)
        ? sent.map((m) => `<div class="row"><span>${m.to || m.ticket_key}</span><span class="badge SENT">SENT</span></div>`).join("") +
          drafts.map((d) => `<div class="row"><span>To ${d.to}</span><span class="badge DRAFT">unsent draft</span></div><div class="mail">${d.body || ""}</div>`).join("")
        : `<div class="empty">No mail</div>`;
      const slackHtml = slack.length
        ? slack.map((m) => `<div class="meta">${(m.idempotency_key || "").startsWith("promiseledger:digest:") ? "Agent digest" : "Human claim"}</div><div class="mail">${m.text}</div>`).join("")
        : `<div class="empty">No messages</div>`;
      return `<div class="app"><div class="app-name">Linear</div>${ticketsHtml}</div>
        <div class="app"><div class="app-name">GitHub</div>${prHtml}</div>
        <div class="app"><div class="app-name">Gmail</div>${mailHtml}</div>
        <div class="app"><div class="app-name">Slack</div>${slackHtml}</div>`;
    }

    async function preview(id) {
      state.current = id;
      [...el("tabs").children].forEach((n) => n.classList.toggle("active", n.dataset.id === id));
      const card = state.scenarios.find((s) => s.id === id);
      el("blurb").textContent = card ? `${card.blurb} Expected: ${card.expect}.` : "";
      el("verdict").className = "verdict";
      el("verdict").textContent = "Idle — press Run agent";
      el("grade").innerHTML = "";
      el("after").innerHTML = `<div class="empty">Waiting for a run.</div>`;
      el("log").innerHTML = `<li>Press Run agent. Nothing has executed yet.</li>`;
      const data = await (await fetch("/api/run?scenario=" + encodeURIComponent(id))).json();
      el("before").innerHTML = worldView(data.initial);
    }

    async function run() {
      const button = el("run");
      button.disabled = true;
      button.textContent = "Running…";
      el("log").innerHTML = "<li>POST /api/run — executing agent</li>";
      el("verdict").textContent = "Running";
      try {
        const data = await (await fetch("/api/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ scenario: state.current }),
        })).json();
        el("before").innerHTML = worldView(data.initial);
        const steps = data.steps || [];
        el("log").innerHTML = "";
        for (const step of steps) {
          const li = document.createElement("li");
          li.className = step.kind || "";
          li.textContent = step.text;
          el("log").appendChild(li);
          await new Promise((r) => setTimeout(r, 180));
        }
        el("after").innerHTML = worldView(data.final);
        const expectedFail = state.current === "s10-silent-200";
        const passed = data.grade.passed;
        el("verdict").className = "verdict " + ((expectedFail ? !passed : passed) ? "pass" : "fail");
        el("verdict").textContent = expectedFail
          ? (passed ? "Unexpected pass" : "Caught silent HTTP 200 — grader failed the run on purpose")
          : (data.report.refused ? "Refused — zero writes" : (passed ? "Grader pass" : "Grader fail"));
        const groups = Object.entries(data.grade.groups || {});
        el("grade").innerHTML = `<table><thead><tr><th>Check</th><th></th><th>Evidence</th></tr></thead><tbody>${
          groups.map(([name, g]) => `<tr><td>${name}</td><td class="${g.passed ? "ok" : "no"}">${g.passed ? "Pass" : "Fail"}</td><td>${g.detail}</td></tr>`).join("")
        }</tbody></table>`;
      } catch (error) {
        el("verdict").className = "verdict fail";
        el("verdict").textContent = String(error.message || error);
      } finally {
        button.disabled = false;
        button.textContent = "Run agent";
      }
    }

    async function load() {
      const data = await (await fetch("/api/run")).json();
      const featured = FEATURED.map((id) => data.scenarios.find((s) => s.id === id)).filter(Boolean);
      const rest = data.scenarios.filter((s) => !FEATURED.includes(s.id));
      state.scenarios = [...featured, ...rest];
      el("tabs").innerHTML = state.scenarios.map((s) =>
        `<button data-id="${s.id}" class="${s.id === state.current ? "active" : ""}">${s.title}</button>`
      ).join("");
      el("tabs").onclick = (event) => {
        const button = event.target.closest("button");
        if (button) preview(button.dataset.id);
      };
      await preview(state.current);
    }

    el("run").onclick = run;
    load();
  </script>
</body>
</html>
