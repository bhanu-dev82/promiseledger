name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Final-state reliability suite
        run: python -m promiseledger.cli eval --output .runs/eval
